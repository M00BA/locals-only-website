<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Meetups – Locals Only</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- TAB ICON -->
  <link rel="icon" type="image/jpeg" href="images/logo-dark.jpg" />
  <link rel="apple-touch-icon" href="images/logo-dark.jpg" />

  <link rel="stylesheet" href="style.css" />
</head>

<body class="theme-night">

  <div class="shooting-star"></div>

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <a href="/">
          <img src="images/logo-dark.jpg" class="logo-image" alt="Locals Only logo" />
        </a>
      </div>

      <button class="nav-toggle" aria-label="Open navigation menu">
        <div class="nav-toggle-line"></div>
        <div class="nav-toggle-line"></div>
        <div class="nav-toggle-line"></div>
      </button>

      <!-- NAV -->
      <nav class="main-nav">
        <a href="/" class="nav-link">Home</a>
        <a href="#" class="openSuggest">Suggest Event</a>
        <a href="https://www.youtube.com/@Mooooba/playlists" target="_blank" rel="noopener noreferrer" class="nav-link">YouTube</a>
        <a href="my-meetups.html" class="nav-link" style="color: var(--accent);">My Meetups</a>
      </nav>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main style="max-width: 1000px; margin: 40px auto; padding: 0 20px;">
    
    <div class="section-header" style="margin-bottom: 30px;">
      <h2>My Joined Meetups</h2>
    </div>

    <!-- Empty state message -->
    <div id="emptyMessage" style="display:none; text-align: center; padding: 60px 20px; color: var(--text-muted);">
      <p style="font-size: 1.1rem; margin-bottom: 16px;">You haven't joined any meetups yet.</p>
      <a href="/" class="login-btn" style="display: inline-block; width: auto; padding: 10px 24px; text-decoration: none;">Browse Meetups</a>
    </div>

    <!-- Meetups Grid -->
    <div id="meetupsContainer" class="events-grid"></div>

  </main>

  <!-- FLOATING SUGGEST BUTTON -->
  <button id="fabSuggest" class="fab-suggest">＋ Suggest</button>

  <!-- SUGGEST EVENT MODAL -->
  <div id="suggestModal" class="modal" style="display:none;">
    <div class="modal-content">
      <span id="closeSuggestModal" class="close">&times;</span>
      <h2 class="modal-title">Suggest a Meetup</h2>

      <label class="login-sub">Your Name</label>
      <input id="suggestName" class="login-input" type="text" placeholder="e.g. Mooba" />

      <label class="login-sub">Your Email</label>
      <input id="suggestEmail" class="login-input" type="email" readonly />

      <label class="login-sub">Event Idea</label>
      <input id="suggestTitle" class="login-input" type="text" placeholder="e.g. Sunset Walk" />

      <label class="login-sub">Description</label>
      <textarea id="suggestDescription" class="login-input" placeholder="Tell us about your idea..." style="height:120px;"></textarea>

      <button id="submitSuggestion" class="login-btn" style="margin-top: 20px;">
        Send Suggestion
      </button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="main.js"></script>

</body>
</html>
